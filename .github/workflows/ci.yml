name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e './worker[cv]'

      - run: python worker/tests/test_pipeline.py
      - run: python worker/tests/test_calibration.py
      - run: python worker/tests/test_robustness.py
      - run: python worker/tests/test_motion.py

      - run: npm run smoke
