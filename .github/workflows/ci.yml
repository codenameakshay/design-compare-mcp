name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e './worker[cv]'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/extract-video-test.mjs

      - run: python worker/tests/test_pipeline.py
      - run: python worker/tests/test_calibration.py
      - run: python worker/tests/test_robustness.py
      - run: python worker/tests/test_motion.py
      - run: python worker/tests/test_color_stability.py
      - run: python worker/tests/test_reliability.py

      - run: npm run smoke
      - run: node scripts/reliability-smoke.mjs
      - run: python scripts/reliability-benchmark.py --self-test-runner
      - run: node scripts/render-reliability-test.mjs docs/reliability/runs/final
