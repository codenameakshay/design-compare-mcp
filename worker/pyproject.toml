[project]
name = "design-compare-vision-worker"
version = "0.11.0"
description = "Persistent vision worker for design-compare-mcp"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cv = [
  "numpy==2.5.1",
  "opencv-python-headless>=4.8,<6",
  "scikit-image==0.26.0",
  "Pillow==12.3.0",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vision_worker"]
